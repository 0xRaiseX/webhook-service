[project]
name = "webhook-service"
version = "0.1.0"
description = "Web3 Event-as-a-Service core (FastAPI + Postgres)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.1.0",
  "sqlalchemy[asyncio]>=2.0.25",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "httpx>=0.26.0",
  "eth-abi>=4.2.1",
  "eth-utils>=4.0.0",
  "python-dateutil>=2.8.2",
  "prometheus-client>=0.19.0",
  "cryptography>=42.0.0",
  "bcrypt>=4.1.2",
  "orjson>=3.9.15"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.5",
  "ruff>=0.3.0",
  "mypy>=1.8.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
