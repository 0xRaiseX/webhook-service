apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhook-api
  template:
    metadata:
      labels:
        app: webhook-api
    spec:
      containers:
        - name: api
          image: webhook-service:latest
          args: ["uvicorn", "src.webhook_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: webhook-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: webhook-secrets
                  key: ENCRYPTION_KEY
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /v1/events
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-api
spec:
  selector:
    app: webhook-api
  ports:
    - port: 80
      targetPort: 8000
