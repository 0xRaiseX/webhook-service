apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-config
data:
  RPC_ENDPOINTS: "https://mainnet.infura.io/v3/demo"
---
apiVersion: v1
kind: Secret
metadata:
  name: webhook-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://webhook:webhook@postgres:5432/webhook"
  ENCRYPTION_KEY: "please-rotate-this-key"
