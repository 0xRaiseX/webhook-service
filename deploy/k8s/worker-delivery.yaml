apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhook-delivery
  template:
    metadata:
      labels:
        app: webhook-delivery
    spec:
      containers:
        - name: delivery
          image: webhook-service:latest
          args: ["python", "-m", "src.webhook_service.workers.delivery"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: webhook-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: webhook-secrets
                  key: ENCRYPTION_KEY
