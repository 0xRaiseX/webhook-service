apiVersion: batch/v1
kind: Job
metadata:
  name: webhook-migrate
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: webhook-service:latest
          args: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: webhook-secrets
                  key: DATABASE_URL
