apiVersion: batch/v1
kind: CronJob
metadata:
  name: webhook-retention
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: retention
              image: webhook-service:latest
              args: ["python", "-m", "src.webhook_service.workers.retention"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: webhook-secrets
                      key: DATABASE_URL
